<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>收集整理｜日常小秘書</title>
<style>
/* 這一頁刻意「自給自足」：不載入任何外部字型、圖示或 index.html 的程式，單獨打開也能完整使用。
   資料只存在這台裝置的瀏覽器裡（localStorage），不會同步到雲端、不會送到伺服器。 */
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{
  --bg:#fcfaf7;--sur:#fff;--bdr:#e5e7eb;--bd:#5c4b37;--br:#8b7355;--amb:#d4a373;--crm:#f5ede4;
  --t:#5c4b37;--t5:#6b7280;--warn:#b91c1c;--warn-bg:#fef2f2;--warn-bdr:#fecaca;
  --ok:#15803d;--ok-bg:#f0fdf4;--ok-bdr:#bbf7d0;--note:#92400e;--note-bg:#fffbeb;--note-bdr:#fde68a;
  --side-w:272px
}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
a{color:var(--br)}

/* ===== 版面：側邊欄 + 主內容 ===== */
#app{display:flex;min-height:100vh}
#sidebar{width:var(--side-w);flex:0 0 var(--side-w);background:var(--sur);border-right:1px solid var(--bdr);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:30;transition:transform .22s ease}
#sidebarMask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
.brand{padding:16px 16px 12px;border-bottom:1px solid #f1ece5}
.brand-row{display:flex;align-items:center;gap:10px}
.brand-ico{width:36px;height:36px;border-radius:12px;background:var(--br);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 36px}
.brand h1{font-size:16px;color:var(--bd);font-family:"Noto Serif TC",serif;line-height:1.3}
.brand p{font-size:11px;color:var(--t5);margin-top:2px}
#sideClose{display:none;border:none;background:none;color:var(--t5);font-size:18px;padding:6px;cursor:pointer;margin-left:auto}
.side-body{flex:1;overflow-y:auto;padding:12px 10px}
.side-sec{margin-bottom:14px}
.navrow{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:12px;font-size:13.5px;font-weight:600;color:var(--t);cursor:pointer;min-height:40px}
.navrow:hover{background:var(--crm)}
.navrow.active{background:#efe6da;color:var(--bd)}
.navrow .cnt{margin-left:auto;font-size:11px;color:var(--t5);background:var(--crm);padding:1px 7px;border-radius:999px}
.navrow.active .cnt{background:#e4d5c0;color:var(--bd)}
.sec-hd{display:flex;align-items:center;gap:6px;padding:6px 8px;font-size:11.5px;font-weight:800;color:var(--t5);text-transform:uppercase;letter-spacing:.03em}
.sec-hd .cnt-b{background:var(--crm);color:var(--t5);font-size:10px;padding:0 6px;border-radius:999px;font-weight:700}
.sec-hd button{border:none;background:none;color:var(--br);font-size:14px;padding:4px 6px;cursor:pointer;border-radius:8px}
.sec-hd button:hover{background:var(--crm)}
.sec-hd .toggle{margin-right:auto;flex:1;display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--t5)}
.fnode{position:relative}
.frow{display:flex;align-items:center;gap:4px;padding:7px 6px;border-radius:10px;font-size:13px;cursor:pointer;min-height:38px}
.frow:hover{background:var(--crm)}
.frow.active{background:#efe6da;color:var(--bd);font-weight:700}
.frow.dragover{outline:2px solid var(--br);background:#efe6da}
.ftoggle,.ftoggle-ph{width:18px;height:18px;flex:0 0 18px;display:flex;align-items:center;justify-content:center;border:none;background:none;color:var(--t5);font-size:11px;cursor:pointer;border-radius:6px}
.ficon{flex:0 0 auto;font-size:14px;width:18px;text-align:center}
.fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcount{font-size:10.5px;color:var(--t5);flex:0 0 auto}
.fops{display:flex;gap:1px;flex:0 0 auto;margin-left:2px}
.fop{border:none;background:none;color:var(--t5);font-size:12px;padding:4px;border-radius:7px;cursor:pointer;min-width:26px;min-height:26px}
.fop:hover{background:#e9e1d6;color:var(--bd)}
.tagwrap{display:flex;flex-wrap:wrap;gap:6px;padding:4px 2px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid transparent;line-height:1.5;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.pill .n{opacity:.75;font-size:10.5px}
.tagfilter{width:100%;padding:7px 9px;border:1px solid var(--bdr);border-radius:10px;font-size:13px;background:var(--bg);margin-bottom:6px}
.more-tag-btn{width:100%;margin-top:6px;padding:6px;border-radius:9px;border:1px solid var(--bdr);background:var(--bg);color:var(--t5);font-size:12px;cursor:pointer}
.side-foot{padding:12px;border-top:1px solid #f1ece5}
.side-foot .btn{margin-top:0}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--bdr);padding:10px 14px}
.tb-row1{display:flex;align-items:center;gap:8px}
#hamb{display:none;border:1px solid var(--bdr);background:var(--sur);color:var(--bd);width:40px;height:40px;border-radius:10px;font-size:16px;cursor:pointer;flex:0 0 40px}
.searchbox{flex:1;position:relative;min-width:0}
.searchbox-in{display:flex;align-items:center;background:var(--crm);border:1px solid var(--bdr);border-radius:13px;min-height:42px;padding:0 4px 0 2px}
.searchmode{display:flex;align-items:center;gap:4px;border:none;background:none;color:var(--t);font-size:12.5px;font-weight:700;padding:7px 8px;cursor:pointer;white-space:nowrap}
.searchmode .car{color:var(--t5);font-size:10px}
.sdiv{width:1px;height:18px;background:var(--bdr);flex:0 0 1px}
.searchbox input[type=text]{flex:1;min-width:0;border:none;background:none;padding:9px 8px;font-size:16px;color:var(--t)}
.searchbox input[type=text]:focus{outline:none}
.sclear{border:none;background:none;color:var(--t5);font-size:15px;padding:6px 9px;cursor:pointer}
.dropdown{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--sur);border:1px solid var(--bdr);border-radius:14px;box-shadow:0 10px 30px rgba(92,75,55,.14);z-index:40;max-height:60vh;overflow-y:auto}
.dropdown .ddhd{padding:8px 12px;font-size:11px;color:var(--t5);font-weight:700;border-bottom:1px solid #f1ece5}
.ddopt{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;font-size:13.5px}
.ddopt:hover,.ddopt.hi{background:var(--crm)}
.ddopt .dsc{font-size:11px;color:var(--t5);margin-left:auto}
.addbtn{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--br);color:#fff;border:none;border-radius:13px;padding:0 14px;height:42px;font-size:13.5px;font-weight:800;cursor:pointer;white-space:nowrap}
.tb-row2{display:flex;align-items:center;gap:8px;margin-top:8px;overflow-x:auto;padding-bottom:2px}
.tb-row2::-webkit-scrollbar{display:none}
.platpill{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--bdr);background:var(--sur);color:var(--t);white-space:nowrap}
.platpill.active{background:var(--bd);color:#fff;border-color:var(--bd)}
.tb-gap{margin-left:auto;flex:0 0 auto;display:flex;align-items:center;gap:6px}
.iconbtn{border:1px solid var(--bdr);background:var(--sur);color:var(--t);width:36px;height:36px;border-radius:10px;font-size:14px;cursor:pointer;flex:0 0 36px;display:flex;align-items:center;justify-content:center}
.iconbtn.active{background:var(--crm)}
.segbtn{display:flex;border:1px solid var(--bdr);border-radius:10px;overflow:hidden}
.segbtn button{border:none;background:var(--sur);color:var(--t5);padding:0 9px;height:36px;font-size:13px;cursor:pointer}
.segbtn button.on{background:var(--br);color:#fff}
select.plain{border:1px solid var(--bdr);background:var(--sur);border-radius:10px;padding:0 8px;height:36px;font-size:12.5px;color:var(--t)}

#content{flex:1;padding:16px 16px 60px;max-width:1280px;margin:0 auto;width:100%}
.hd-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.hd-title{font-size:16px;font-weight:800;color:var(--bd);font-family:"Noto Serif TC",serif}
.hd-cnt{font-size:12px;color:var(--t5);background:var(--crm);padding:2px 9px;border-radius:999px}
.filterbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:var(--sur);border:1px solid var(--bdr);border-radius:13px;margin-bottom:12px;font-size:12.5px}
.filterbar .lbl{color:var(--t5);font-weight:700}
.fchip{display:inline-flex;align-items:center;gap:5px;background:var(--crm);padding:3px 5px 3px 10px;border-radius:999px;font-size:12px}
.fchip button{border:none;background:none;color:var(--t5);cursor:pointer;font-size:13px;padding:2px 5px}
.filterbar .clearall{margin-left:auto;color:var(--warn);font-weight:700;cursor:pointer;background:none;border:none;font-size:12px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--sur);border:1px solid var(--bdr);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
.card .banner{height:120px;position:relative;background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:space-between;padding:10px;color:#fff;overflow:hidden}
.card .banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .banner .bemoji{font-size:30px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.25))}
.card .banner .bsub{font-size:11px;opacity:.9;line-clamp:2;-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;position:relative;z-index:1}
.platbadge{position:absolute;top:8px;left:8px;z-index:1;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--t);display:inline-flex;align-items:center;gap:4px}
.card .body{padding:11px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .folderline{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t5);min-width:0}
.card .folderline .fb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .title{font-size:14px;font-weight:800;color:var(--bd);line-clamp:2;-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.card .notes{font-size:12px;color:var(--t5);line-clamp:2;-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.card .tagrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;padding-top:4px}
.card .meta{font-size:10.5px;color:#a89a87;display:flex;flex-direction:column;gap:1px;border-top:1px solid #f1ece5;padding-top:6px;margin-top:4px}
.card .acts{display:flex;gap:4px;padding:0 12px 10px;justify-content:flex-end}
.acts .ab{border:1px solid var(--bdr);background:var(--bg);color:var(--t5);width:30px;height:30px;border-radius:9px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.acts .ab:hover{background:var(--crm);color:var(--bd)}

.listwrap{background:var(--sur);border:1px solid var(--bdr);border-radius:16px;overflow:hidden}
.lrow{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid #f1ece5;cursor:pointer}
.lrow:last-child{border-bottom:none}
.lrow:hover{background:var(--crm)}
.lthumb{width:52px;height:52px;border-radius:12px;flex:0 0 52px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;overflow:hidden;position:relative}
.lthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lmain{flex:1;min-width:0}
.lmain .t1{font-size:14px;font-weight:800;color:var(--bd);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lmain .t2{font-size:11.5px;color:var(--t5);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.lmain .tagrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.lacts{display:flex;gap:4px;flex:0 0 auto}

.empty{background:var(--sur);border:1px dashed var(--bdr);border-radius:18px;padding:40px 20px;text-align:center;max-width:420px;margin:30px auto}
.empty .ic{font-size:34px;margin-bottom:8px}
.empty h3{font-size:15px;color:var(--bd);margin-bottom:6px}
.empty p{font-size:13px;color:var(--t5);margin-bottom:14px;line-height:1.6}

/* ===== 按鈕 / 輸入框（沿用小秘書樣式）===== */
.btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 16px;border-radius:12px;border:1px solid var(--bdr);background:var(--sur);color:var(--bd);font-weight:700;font-size:14px;cursor:pointer;touch-action:manipulation}
.btn.pri{background:var(--br);border-color:var(--br);color:#fff}
.btn.dng{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--t5)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.btn.sm{min-height:38px;font-size:13px;padding:7px 12px}
input[type=text],input[type=url],input[type=email],input[type=password],input[type=file],textarea,select.full{width:100%;font-size:16px;border:1px solid var(--bdr);border-radius:11px;padding:10px 12px;background:#fff;color:var(--t)}
textarea{resize:vertical;min-height:70px;font-family:inherit}
label.lb{display:block;font-size:12.5px;font-weight:700;color:var(--t5);margin-bottom:5px}
.hint{font-size:11.5px;color:var(--t5);margin-top:4px}
.field{margin-bottom:13px}

/* ===== 彈窗 ===== */
.ov{position:fixed;inset:0;background:rgba(40,30,20,.45);display:flex;align-items:center;justify-content:center;padding:14px;z-index:200;overflow-y:auto}
.panel{background:var(--sur);border-radius:20px;max-width:560px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.panel.sm{max-width:420px}
.panel.lg{max-width:720px}
.panel-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid #f1ece5;position:sticky;top:0;background:var(--sur);z-index:2;border-radius:20px 20px 0 0}
.panel-hd h3{font-size:16px;color:var(--bd);font-family:"Noto Serif TC",serif}
.panel-hd button{border:none;background:var(--crm);color:var(--t5);width:30px;height:30px;border-radius:50%;font-size:14px;cursor:pointer}
.panel-bd{padding:16px 18px}
.panel-ft{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 18px}
.colorgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-height:160px;overflow-y:auto;padding:4px;background:var(--bg);border:1px solid var(--bdr);border-radius:12px}
.colorcell{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:10px;border:2px solid transparent;cursor:pointer}
.colorcell.on{border-color:var(--bd);box-shadow:0 0 0 2px #fff inset}
.colorcell .sw{width:60%;height:60%;border-radius:50%}
.icongrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-height:140px;overflow-y:auto;padding:4px;background:var(--bg);border:1px solid var(--bdr);border-radius:12px}
.iconcell{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:10px;border:2px solid transparent;cursor:pointer;font-size:17px;background:#fff}
.iconcell.on{border-color:var(--br);background:var(--crm)}
.preview-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border:1px solid var(--bdr);border-radius:12px;margin-bottom:12px}
.preview-row .pic{width:34px;height:34px;border-radius:10px;background:#fff;border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;font-size:16px}
.chipin{display:flex;gap:6px;align-items:stretch}
.chipin input{flex:1}
.tagedit{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tagedit .pill button{border:none;background:none;color:inherit;opacity:.65;cursor:pointer;font-size:12px}
.movelist{display:flex;flex-direction:column;gap:2px;max-height:50vh;overflow-y:auto}
.moveopt{display:flex;align-items:center;gap:8px;padding:11px 10px;border-radius:11px;cursor:pointer;font-size:13.5px;min-height:42px}
.moveopt:hover{background:var(--crm)}
.moveopt.cur{color:var(--t5);background:var(--bg)}
.platgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.platopt{display:flex;align-items:center;justify-content:center;gap:5px;padding:9px 6px;border:1px solid var(--bdr);border-radius:11px;font-size:12.5px;font-weight:700;cursor:pointer;background:#fff}
.platopt.on{border-color:var(--br);background:var(--crm);color:var(--bd)}
.segtab{display:flex;gap:4px;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:14px}
.segtab button{flex:1;border:none;background:none;color:var(--t5);font-weight:700;font-size:12.5px;padding:8px;border-radius:9px;cursor:pointer}
.segtab button.on{background:#fff;color:var(--br);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.uploadbox{display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px dashed var(--bdr);border-radius:14px;padding:22px 14px;background:var(--bg);cursor:pointer;text-align:center}
.uploadbox .ic{font-size:26px;margin-bottom:6px}
.statrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center;background:var(--bg);border:1px solid var(--bdr);border-radius:12px;padding:10px;margin-bottom:12px}
.statrow .num{font-size:17px;font-weight:800;color:var(--br)}
.statrow .lb2{font-size:10.5px;color:var(--t5)}
.plattag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;background:#fff;border:1px solid var(--bdr)}
.note{font-size:12.5px;line-height:1.7;border-radius:11px;padding:9px 12px;margin:10px 0 0;background:var(--note-bg);border:1px solid var(--note-bdr);color:var(--note)}
.note.bad{background:var(--warn-bg);border-color:var(--warn-bdr);color:var(--warn)}
.note.good{background:var(--ok-bg);border-color:var(--ok-bdr);color:var(--ok)}
.note.plain{background:var(--crm);border-color:var(--bdr);color:var(--t)}

#toastRoot{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:500;display:flex;flex-direction:column;gap:8px;align-items:center;max-width:94vw}
.toast{background:var(--bd);color:#fff;padding:11px 16px;border-radius:13px;font-size:13px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast button{border:none;background:rgba(255,255,255,.18);color:#fff;border-radius:9px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}

@media (max-width:860px){
  #sidebar{position:fixed;top:0;left:0;transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}
  #sidebarMask.show{display:block}
  #hamb{display:flex}
  .colorgrid,.icongrid{grid-template-columns:repeat(6,1fr)}
}
@media (max-width:420px){
  #content{padding:12px 10px 50px}
  .panel-bd{padding:14px}
}
</style>
</head>
<body>
<div id="app">
  <div id="sidebarMask"></div>
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-row">
        <div class="brand-ico">🗂️</div>
        <div>
          <h1>收集整理</h1>
          <p>跨平台書籤與靈感收藏</p>
        </div>
        <button id="sideClose">✕</button>
      </div>
    </div>
    <div class="side-body" id="sideBody"></div>
    <div class="side-foot">
      <button class="btn block" id="btnSettings" type="button">⚙️ 設定與資料備份</button>
    </div>
  </aside>

  <main id="main">
    <div id="topbar">
      <div class="tb-row1">
        <button id="hamb" type="button" aria-label="選單">☰</button>
        <div class="searchbox" id="searchBox">
          <div class="searchbox-in">
            <button type="button" class="searchmode" id="searchModeBtn"></button>
            <div class="sdiv"></div>
            <input type="text" id="searchInput" autocomplete="off" placeholder="搜尋...">
            <button type="button" class="sclear" id="searchClear" hidden>✕</button>
          </div>
          <div id="searchDropRoot"></div>
        </div>
        <button class="addbtn" id="btnAddItem" type="button">＋ 新增收藏</button>
      </div>
      <div class="tb-row2" id="platRow"></div>
    </div>
    <div id="content"></div>
  </main>
</div>

<div id="modalRoot"></div>
<div id="confirmRoot"></div>
<div id="toastRoot"></div>

<script>
(function(){
'use strict';

// =====================================================================
// 常數：顏色、圖示、平台
// =====================================================================
var LS = {
  F:'collect_folders_v1', I:'collect_items_v1', P:'collect_platforms_v1',
  TC:'collect_tagcolors_v1', ST:'collect_settings_v1'
};

var FOLDER_ICONS = ['📁','⭐','❤️','🔖','💡','🎨','📷','🎬','🎵','📄','📚','🌐','🧭','💼','💻','🛍️','☕','🎁','🏆','👑','🚀','🔥','⚡','🍃','☀️','🌙','😊','📌'];

var COLORS = [
  {id:'rose',label:'玫瑰粉',hex:'#e75480'},{id:'coral',label:'珊瑚橘',hex:'#f1826d'},
  {id:'amber',label:'琥珀金',hex:'#d4a373'},{id:'gold',label:'暖陽黃',hex:'#c9962e'},
  {id:'olive',label:'橄欖綠',hex:'#8a9a5b'},{id:'leaf',label:'嫩葉綠',hex:'#5f9b43'},
  {id:'emerald',label:'翡翠綠',hex:'#2f9e68'},{id:'teal',label:'湖水青',hex:'#2e9b96'},
  {id:'sky',label:'晴空藍',hex:'#4a90c4'},{id:'blue',label:'靛藍',hex:'#4f6fd4'},
  {id:'indigo',label:'深藍紫',hex:'#6354c4'},{id:'violet',label:'薰衣草紫',hex:'#8b5fbf'},
  {id:'plum',label:'梅紫',hex:'#9c4f8e'},{id:'mauve',label:'藕荷粉',hex:'#b06a8f'},
  {id:'brick',label:'磚紅',hex:'#b5463f'},{id:'rust',label:'鐵鏽棕',hex:'#a85c32'},
  {id:'brown',label:'咖啡棕',hex:'#8b6248'},{id:'sand',label:'沙卡其',hex:'#a3875a'},
  {id:'sage',label:'鼠尾草綠',hex:'#6f8363'},{id:'mint',label:'薄荷綠',hex:'#45a383'},
  {id:'cyan',label:'電光青',hex:'#2a97b3'},{id:'slate',label:'石墨灰',hex:'#5c6977'},
  {id:'steel',label:'鋼鐵藍',hex:'#51708c'},{id:'berry',label:'覆盆子紅',hex:'#c23b5e'},
  {id:'peach',label:'蜜桃橘',hex:'#da7f4e'},{id:'lime',label:'青檸綠',hex:'#7ba233'},
  {id:'charcoal',label:'炭灰黑',hex:'#4a4a4a'},{id:'graphite',label:'深灰',hex:'#6b6b6b'}
];

var PLATFORMS = {
  web:{name:'一般網頁',emoji:'🌐',hex:'#4f6fd4'},
  tiktok:{name:'TikTok',emoji:'🎬',hex:'#2b2b2b'},
  instagram:{name:'IG',emoji:'📸',hex:'#c23b78'},
  pinterest:{name:'Pinterest',emoji:'📌',hex:'#c8232c'},
  threads:{name:'Threads',emoji:'🧵',hex:'#2b2b2b'},
  xiaohongshu:{name:'小紅書',emoji:'📕',hex:'#e02050'},
  youtube:{name:'YouTube',emoji:'▶️',hex:'#d62828'},
  image:{name:'圖片',emoji:'🖼️',hex:'#2a9d8f'},
  pdf:{name:'PDF',emoji:'📄',hex:'#c77b1f'}
};

var SEARCH_MODES = [
  {id:'all',label:'全部欄位',ph:'搜尋名稱、標籤或筆記...'},
  {id:'name',label:'僅搜尋名稱',ph:'輸入標題或網址關鍵字...'},
  {id:'tag',label:'僅搜尋標籤',ph:'輸入標籤名稱搜尋...'}
];
var SORT_MODES = [
  {id:'updatedDesc',label:'最近修改優先'},{id:'createdDesc',label:'最新加入優先'},{id:'titleAsc',label:'標題 A-Z'}
];

// =====================================================================
// 小工具
// =====================================================================
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(p){ return p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function pad(n){ return (n<10?'0':'')+n; }
function fmtDT(iso){
  if(!iso) return '未知時間';
  var d=new Date(iso); if(isNaN(d.getTime())) return iso;
  return d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
}
function hexToRgb(hex){
  hex=String(hex||'#999999').replace('#','');
  if(hex.length===3) hex=hex.split('').map(function(c){return c+c;}).join('');
  var n=parseInt(hex,16)||0x999999;
  return [(n>>16)&255,(n>>8)&255,n&255];
}
function rgba(hex,a){ var c=hexToRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function darken(hex,amt){ var c=hexToRgb(hex); function d(v){ return Math.max(0,Math.round(v*(1-amt))); } return 'rgb('+d(c[0])+','+d(c[1])+','+d(c[2])+')'; }
function pillStyle(hex){ return 'background:'+rgba(hex,.15)+';color:'+darken(hex,.3)+';border-color:'+rgba(hex,.4); }
function activeStyle(hex){ return 'background:'+hex+';color:#fff;border-color:'+hex; }
function colorMeta(id){ for(var i=0;i<COLORS.length;i++){ if(COLORS[i].id===id) return COLORS[i]; } return COLORS[0]; }
function debounceIdle(fn){ var t=null; return function(){ var a=arguments; clearTimeout(t); t=setTimeout(function(){ fn.apply(null,a); },0); }; }

// =====================================================================
// 狀態
// =====================================================================
var S = {
  folders:[], items:[], customPlatforms:[], tagColors:{},
  settings:{viewMode:'grid',sortBy:'updatedDesc'},
  selectedNav:'all', selectedPlatform:'all', selectedTags:[],
  searchQuery:'', searchMode:'all', searchOpen:false, modeOpen:false, activeSug:-1,
  recentSearches:[], expandedFolders:{}, sidebarOpen:false,
  historyStack:[], undoOpen:false,
  modal:null,   // {type, ...}
  confirm:null, // {title,message,confirmText,danger,onConfirm}
  toast:null
};

function loadAll(){
  try{ var f=JSON.parse(lsGet(LS.F)||'[]'); S.folders=Array.isArray(f)?f:[]; }catch(e){ S.folders=[]; }
  try{ var it=JSON.parse(lsGet(LS.I)||'[]'); S.items=Array.isArray(it)?it:[]; }catch(e){ S.items=[]; }
  try{ var cp=JSON.parse(lsGet(LS.P)||'[]'); S.customPlatforms=Array.isArray(cp)?cp:[]; }catch(e){ S.customPlatforms=[]; }
  try{ var tc=JSON.parse(lsGet(LS.TC)||'{}'); S.tagColors=(tc&&typeof tc==='object')?tc:{}; }catch(e){ S.tagColors={}; }
  try{
    var st=JSON.parse(lsGet(LS.ST)||'{}');
    if(st&&typeof st==='object'){
      S.settings.viewMode=st.viewMode==='list'?'list':'grid';
      S.settings.sortBy=['updatedDesc','createdDesc','titleAsc'].indexOf(st.sortBy)>=0?st.sortBy:'updatedDesc';
    }
  }catch(e){}
}
function saveFolders(){ if(!lsSet(LS.F,JSON.stringify(S.folders))) toast('⚠️ 資料夾儲存失敗，瀏覽器空間可能不足','bad'); }
function saveItems(){ if(!lsSet(LS.I,JSON.stringify(S.items))) toast('⚠️ 儲存失敗，瀏覽器空間可能不足（檔案太大時常見，請避免上傳過大的圖片）','bad'); }
function savePlatforms(){ lsSet(LS.P,JSON.stringify(S.customPlatforms)); }
function saveTagColors(){ lsSet(LS.TC,JSON.stringify(S.tagColors)); }
function saveSettings(){ lsSet(LS.ST,JSON.stringify(S.settings)); }

// =====================================================================
// 資料夾輔助
// =====================================================================
function rootFolders(){ return S.folders.filter(function(f){ return !f.parentId; }); }
function subFolders(pid){ return S.folders.filter(function(f){ return f.parentId===pid; }); }
function folderById(id){ for(var i=0;i<S.folders.length;i++){ if(S.folders[i].id===id) return S.folders[i]; } return null; }
function descendantIds(rootId){
  var out=[], queue=[rootId];
  while(queue.length){
    var cur=queue.shift();
    S.folders.forEach(function(f){ if(f.parentId===cur){ out.push(f.id); queue.push(f.id); } });
  }
  return out;
}
function breadcrumb(fid){
  if(!fid) return '未分類';
  var names=[], cur=folderById(fid), seen={};
  while(cur&&!seen[cur.id]){ seen[cur.id]=1; names.unshift(cur.name); cur=cur.parentId?folderById(cur.parentId):null; }
  return names.length?names.join(' / '):'未分類';
}
function folderCounts(){
  var c={};
  S.folders.forEach(function(f){
    var valid={}; valid[f.id]=1; descendantIds(f.id).forEach(function(d){ valid[d]=1; });
    c[f.id]=S.items.filter(function(it){ return valid[it.folderId]; }).length;
  });
  return c;
}
function uncategorizedCount(){
  var ids={}; S.folders.forEach(function(f){ ids[f.id]=1; });
  return S.items.filter(function(it){ return !it.folderId||!ids[it.folderId]; }).length;
}

// =====================================================================
// 標籤 / 平台輔助
// =====================================================================
function tagStyle(tag){
  var cid=S.tagColors[tag];
  if(cid){ var m=colorMeta(cid); if(m) return m; }
  var hash=0; for(var i=0;i<tag.length;i++){ hash=tag.charCodeAt(i)+((hash<<5)-hash); }
  return COLORS[Math.abs(hash)%COLORS.length];
}
function allTagsWithCount(){
  var map={};
  S.items.forEach(function(it){ (it.tags||[]).forEach(function(t){ map[t]=(map[t]||0)+1; }); });
  return Object.keys(map).map(function(k){ return {name:k,count:map[k]}; }).sort(function(a,b){ return b.count-a.count; });
}
function builtinPlatformIds(){ return Object.keys(PLATFORMS); }
function allPlatforms(){
  var list=builtinPlatformIds().map(function(id){ return Object.assign({id:id},PLATFORMS[id]); });
  S.customPlatforms.forEach(function(p){ list.push({id:p.id,name:p.name,emoji:p.emoji||'🔗',hex:'#8b6248'}); });
  return list;
}
function platformInfo(id){
  if(PLATFORMS[id]) return Object.assign({id:id},PLATFORMS[id]);
  var cp=S.customPlatforms.filter(function(p){ return p.id===id; })[0];
  if(cp) return {id:cp.id,name:cp.name,emoji:cp.emoji||'🔗',hex:'#8b6248'};
  return Object.assign({id:'web'},PLATFORMS.web);
}
function detectPlatform(url){
  if(!url) return 'web';
  var u=url.toLowerCase();
  if(u.indexOf('tiktok.com')>=0) return 'tiktok';
  if(u.indexOf('instagram.com')>=0||u.indexOf('instagr.am')>=0) return 'instagram';
  if(u.indexOf('pinterest.com')>=0||u.indexOf('pin.it')>=0) return 'pinterest';
  if(u.indexOf('threads.net')>=0) return 'threads';
  if(u.indexOf('xiaohongshu.com')>=0||u.indexOf('xhslink.com')>=0) return 'xiaohongshu';
  if(u.indexOf('youtube.com')>=0||u.indexOf('youtu.be')>=0) return 'youtube';
  if(/\.pdf(\?|#|$)/.test(u)) return 'pdf';
  return 'web';
}

// =====================================================================
// 還原（undo）
// =====================================================================
function snapshot(label){
  S.historyStack.push({
    label:label, t:Date.now(),
    folders:JSON.parse(JSON.stringify(S.folders)),
    items:JSON.parse(JSON.stringify(S.items)),
    customPlatforms:JSON.parse(JSON.stringify(S.customPlatforms)),
    tagColors:JSON.parse(JSON.stringify(S.tagColors))
  });
  if(S.historyStack.length>20) S.historyStack.shift();
}
function undoLast(){
  if(!S.historyStack.length){ toast('目前沒有可還原的操作','bad'); return; }
  var last=S.historyStack.pop();
  S.folders=last.folders; S.items=last.items; S.customPlatforms=last.customPlatforms; S.tagColors=last.tagColors;
  saveFolders(); saveItems(); savePlatforms(); saveTagColors();
  toast('已還原上一步（復原「'+last.label+'」）');
  render();
}
function restoreAllConfirm(){
  openConfirm('清空所有資料？','這會刪除全部資料夾與收藏項目，且無法復原（建議先備份）。確定要清空嗎？','清空所有資料',true,function(){
    S.folders=[]; S.items=[]; S.customPlatforms=[]; S.tagColors={}; S.historyStack=[];
    S.selectedNav='all'; S.selectedPlatform='all'; S.selectedTags=[]; S.searchQuery='';
    saveFolders(); saveItems(); savePlatforms(); saveTagColors();
    closeConfirm(); closeModal();
    toast('已清空所有資料');
    render();
  });
}

// =====================================================================
// 篩選 / 搜尋
// =====================================================================
function filteredItems(){
  var q=S.searchQuery.trim().toLowerCase();
  var validMain=null;
  if(S.selectedNav==='uncategorized'){ /* handled below */ }
  else if(S.selectedNav!=='all'){
    validMain={}; validMain[S.selectedNav]=1; descendantIds(S.selectedNav).forEach(function(d){ validMain[d]=1; });
  }
  var ids={}; S.folders.forEach(function(f){ ids[f.id]=1; });
  var list=S.items.filter(function(it){
    if(S.selectedNav==='uncategorized'){ if(it.folderId&&ids[it.folderId]) return false; }
    else if(validMain){ if(!validMain[it.folderId]) return false; }
    if(S.selectedPlatform!=='all'&&it.platform!==S.selectedPlatform) return false;
    if(S.selectedTags.length&&!S.selectedTags.every(function(t){ return (it.tags||[]).indexOf(t)>=0; })) return false;
    if(q){
      var mt=it.title.toLowerCase().indexOf(q)>=0||(it.url&&it.url.toLowerCase().indexOf(q)>=0);
      var mtag=(it.tags||[]).some(function(t){ return t.toLowerCase().indexOf(q)>=0; });
      var mn=it.notes&&it.notes.toLowerCase().indexOf(q)>=0;
      if(S.searchMode==='name') return mt;
      if(S.searchMode==='tag') return mtag;
      return mt||mtag||mn;
    }
    return true;
  });
  list.sort(function(a,b){
    if(S.settings.sortBy==='titleAsc') return a.title.localeCompare(b.title,'zh-Hant');
    if(S.settings.sortBy==='createdDesc') return new Date(b.createdAt)-new Date(a.createdAt);
    return new Date(b.updatedAt||b.createdAt)-new Date(a.updatedAt||a.createdAt);
  });
  return list;
}
function searchSuggestions(){
  var q=S.searchQuery.trim().toLowerCase(), out=[];
  if(!q){
    allTagsWithCount().slice(0,5).forEach(function(t){ out.push({type:'tag',label:t.name,meta:t.count+' 筆收藏',value:t.name}); });
    S.recentSearches.forEach(function(t){ out.push({type:'hist',label:t,meta:'近期搜尋',value:t}); });
  }else{
    allTagsWithCount().filter(function(t){ return t.name.toLowerCase().indexOf(q)>=0; }).slice(0,4)
      .forEach(function(t){ out.push({type:'tag',label:t.name,meta:'標籤・'+t.count+' 筆',value:t.name}); });
    S.items.filter(function(it){
      if(S.searchMode==='tag') return (it.tags||[]).some(function(t){ return t.toLowerCase().indexOf(q)>=0; });
      if(S.searchMode==='name') return it.title.toLowerCase().indexOf(q)>=0;
      return it.title.toLowerCase().indexOf(q)>=0||(it.notes&&it.notes.toLowerCase().indexOf(q)>=0)||(it.tags||[]).some(function(t){ return t.toLowerCase().indexOf(q)>=0; });
    }).slice(0,4).forEach(function(it){ out.push({type:'item',label:it.title,meta:platformInfo(it.platform).name,itemId:it.id}); });
  }
  return out;
}
function recordSearch(term){
  term=term.trim(); if(!term) return;
  S.recentSearches=[term].concat(S.recentSearches.filter(function(t){ return t!==term; })).slice(0,5);
}

// =====================================================================
// Toast
// =====================================================================
function toast(msg,kind){
  var root=$('toastRoot');
  var el=document.createElement('div');
  el.className='toast';
  var showUndo=S.historyStack.length>0&&kind!=='bad'&&msg.indexOf('已還原')!==0;
  el.innerHTML='<span>'+(kind==='bad'?'⚠️ ':'✓ ')+esc(msg)+'</span>'+(showUndo?'<button type="button" data-act="undo">↩️ 還原上一步</button>':'');
  root.appendChild(el);
  if(showUndo){ el.querySelector('[data-act=undo]').addEventListener('click',function(){ undoLast(); el.remove(); }); }
  setTimeout(function(){ el.remove(); },3400);
}

// =====================================================================
// 資料夾 CRUD
// =====================================================================
function openFolderModal(mode,parentId,target){
  S.modal={type:'folder',mode:mode,parentId:parentId||null,target:target||null,
    name:target?target.name:'',color:target?(target.color||'amber'):'amber',icon:target?(target.icon||'📁'):'📁'};
  renderModal();
}
function submitFolderModal(e){
  e.preventDefault();
  var name=$('ff-name').value.trim();
  if(!name) return;
  var m=S.modal;
  if(m.mode==='create'){
    snapshot('建立資料夾「'+name+'」');
    var nf={id:uid('col'),name:name,parentId:m.parentId||null,color:m.color,icon:m.icon};
    S.folders.push(nf);
    if(m.parentId) S.expandedFolders[m.parentId]=true;
    S.selectedNav=nf.id;
    saveFolders(); toast('已建立資料夾「'+name+'」');
  }else{
    snapshot('編輯資料夾「'+m.target.name+'」');
    m.target.name=name; m.target.color=m.color; m.target.icon=m.icon;
    saveFolders(); toast('已更新資料夾「'+name+'」');
  }
  closeModal(); render();
}
function deleteFolder(folder){
  var dIds=descendantIds(folder.id);
  openConfirm('刪除資料夾「'+folder.name+'」？',
    dIds.length?('此操作會一併移除底下 '+dIds.length+' 個子資料夾，裡面的收藏項目會安全保留並移至「未分類」。'):'裡面的收藏項目不會被刪除，會移至「未分類」。',
    '確認刪除',true,function(){
      snapshot('刪除資料夾「'+folder.name+'」');
      var remove={}; remove[folder.id]=1; dIds.forEach(function(d){ remove[d]=1; });
      S.folders=S.folders.filter(function(f){ return !remove[f.id]; });
      S.items.forEach(function(it){ if(remove[it.folderId]) it.folderId=''; });
      if(remove[S.selectedNav]) S.selectedNav='all';
      saveFolders(); saveItems(); closeConfirm();
      toast('已刪除資料夾「'+folder.name+'」，項目已移至未分類');
      render();
    });
}
function moveFolderTo(folderId,targetParentId){
  var f=folderById(folderId); if(!f) return;
  var norm=targetParentId||null;
  if((f.parentId||null)===norm) return;
  if(norm){ var desc=descendantIds(folderId); if(desc.indexOf(norm)>=0){ toast('無法移到自己的子資料夾底下','bad'); return; } }
  snapshot('移動資料夾「'+f.name+'」');
  f.parentId=norm;
  if(norm) S.expandedFolders[norm]=true;
  saveFolders();
  toast('已將「'+f.name+'」移動至「'+(norm?breadcrumb(norm):'最上層')+'」');
  render();
}

// =====================================================================
// 收藏項目 CRUD
// =====================================================================
function fallbackTitle(data){
  if(data.title&&data.title.trim()) return data.title.trim();
  if(data._fileName) return data._fileName;
  if(data.url){
    try{ var u=new URL(data.url); return platformInfo(data.platform).name+' 收藏 ('+u.hostname.replace(/^www\./,'')+')'; }
    catch(e){ return data.url.slice(0,48); }
  }
  if(data.notes&&data.notes.trim()) return data.notes.trim().slice(0,30)+(data.notes.trim().length>30?'…':'');
  return '未命名'+platformInfo(data.platform).name+'收藏';
}
function openItemModal(editing){
  S.modal={type:'item',editing:editing||null,
    contentType:(editing&&(editing.fileData||editing.platform==='pdf'||editing.platform==='image'))?'file':'link',
    platform:editing?editing.platform:'web',
    folderId:editing?(editing.folderId||''):(S.selectedNav!=='all'&&S.selectedNav!=='uncategorized'?S.selectedNav:''),
    tags:editing?(editing.tags||[]).slice():[], tagColorId:COLORS[9].id,
    fileData:editing?(editing.fileData||null):null, fileName:editing?(editing.fileName||''):'',
    title:editing?(editing.title||''):'', url:editing?(editing.url||''):'', notes:editing?(editing.notes||''):'', tagInput:'',
    addingPlatform:false, newPlatName:'', newFolderName:''
  };
  renderModal();
}
function submitItemModal(e){
  e.preventDefault();
  var m=S.modal;
  var title=$('if-title').value;
  var url=m.contentType==='link'?$('if-url').value.trim():'';
  var notes=$('if-notes').value.trim();
  var pending=$('if-tagin')?$('if-tagin').value.trim().replace(/^#/,''):'';
  var tags=m.tags.slice();
  if(pending&&tags.indexOf(pending)<0) tags.push(pending);
  var data={
    title:title, url:url, platform:m.platform, folderId:m.folderId, tags:tags, notes:notes,
    coverUrl:'', fileData:m.contentType==='file'?m.fileData:null, fileName:m.contentType==='file'?m.fileName:''
  };
  data.title=fallbackTitle(Object.assign({},data,{_fileName:data.fileName}));
  var now=new Date().toISOString();
  if(m.editing){
    snapshot('編輯收藏「'+m.editing.title+'」');
    Object.assign(m.editing,data,{updatedAt:now});
    toast('已更新收藏內容');
  }else{
    snapshot('新增收藏「'+data.title+'」');

function addCustomPlatform(name,emoji){
  name=name.trim(); if(!name) return null;
  var exist=S.customPlatforms.filter(function(p){ return p.name.toLowerCase()===name.toLowerCase(); })[0];
  if(exist) return exist.id;
  var builtinMatch=Object.keys(PLATFORMS).filter(function(k){ return PLATFORMS[k].name.toLowerCase()===name.toLowerCase(); })[0];
  if(builtinMatch) return builtinMatch;
  var np={id:uid('plat'),name:name,emoji:(emoji||'🔗')};
  S.customPlatforms.push(np); savePlatforms();
  toast('已新增自訂平台「'+name+'」');
  return np.id;
}
function deleteCustomPlatform(id){
  var p=S.customPlatforms.filter(function(x){ return x.id===id; })[0]; if(!p) return;
  S.customPlatforms=S.customPlatforms.filter(function(x){ return x.id!==id; });
  if(S.selectedPlatform===id) S.selectedPlatform='all';
  savePlatforms();
  toast('已移除自訂平台「'+p.name+'」');
  renderModal(); render();
}

// =====================================================================
// 備份 / 還原（JSON）
// =====================================================================
function exportData(){
  var payload={app:'收集整理｜日常小秘書',format:'collect-tidy-v1',exportedAt:new Date().toISOString(),
    folders:S.folders,items:S.items,customPlatforms:S.customPlatforms,tagColors:S.tagColors};
  var text=JSON.stringify(payload,null,2);
  var blob=new Blob([text],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  var d=new Date(); var stamp=d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes());
  a.href=url; a.download='收集整理備份-'+stamp+'.json'; a.style.display='none';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ try{ a.remove(); URL.revokeObjectURL(url); }catch(e){} },3000);
  toast('已匯出 '+S.items.length+' 筆收藏與 '+S.folders.length+' 個資料夾');
}
function handleImportFile(e){
  var file=e.target.files&&e.target.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(ev){
    var parsed;
    try{ parsed=JSON.parse(String(ev.target.result||'{}')); }
    catch(err){ toast('無法讀取這個檔案，請確認是這個頁面匯出的備份檔','bad'); return; }
    if(!parsed||!Array.isArray(parsed.items)||!Array.isArray(parsed.folders)){
      toast('檔案格式不正確（缺少資料夾或項目欄位）','bad'); return;
    }
    S.modal={type:'importPreview',fileName:file.name,data:parsed};
    renderModal();
  };
  reader.onerror=function(){ toast('讀取檔案失敗，請再試一次','bad'); };
  reader.readAsText(file,'UTF-8');
  e.target.value='';
}
function confirmImport(mode){
  var m=S.modal; var data=m.data;
  snapshot(mode==='merge'?'合併匯入資料':'覆蓋匯入資料');
  if(mode==='replace'){
    S.folders=data.folders; S.items=data.items;
    if(Array.isArray(data.customPlatforms)) S.customPlatforms=data.customPlatforms;
    if(data.tagColors&&typeof data.tagColors==='object') S.tagColors=data.tagColors;
    S.selectedNav='all';
    toast('已覆蓋還原 '+data.items.length+' 筆收藏資料');
  }else{
    var existIds={}; S.folders.forEach(function(f){ existIds[f.id]=1; });
    var newFolders=data.folders.filter(function(f){ return !existIds[f.id]; });
    S.folders=S.folders.concat(newFolders);
    var existItemIds={}; S.items.forEach(function(it){ existItemIds[it.id]=1; });
    var merged=data.items.map(function(it,idx){
      if(existItemIds[it.id]) return Object.assign({},it,{id:it.id+'-imp-'+Date.now()+'-'+idx});
      return it;
    });
    S.items=merged.concat(S.items);
    if(Array.isArray(data.customPlatforms)){
      var existPlatIds={}; S.customPlatforms.forEach(function(p){ existPlatIds[p.id]=1; });
      S.customPlatforms=S.customPlatforms.concat(data.customPlatforms.filter(function(p){ return !existPlatIds[p.id]; }));
    }
    if(data.tagColors&&typeof data.tagColors==='object') S.tagColors=Object.assign({},data.tagColors,S.tagColors);
    toast('已合併匯入 '+merged.length+' 筆收藏資料');
  }
  saveFolders(); saveItems(); savePlatforms(); saveTagColors();
  closeModal(); render();
}

function folderNodeHtml(folder,depth){

    + '<div class="frow'+(active?' active':'')+'" draggable="true" data-drag="folder" data-fid="'+folder.id+'" data-drop="folder" data-dropfid="'+folder.id+'" data-act="nav" data-id="'+folder.id+'">'
    +   (subs.length?('<button class="ftoggle" data-act="ftoggle" data-id="'+folder.id+'">'+(expanded?'▾':'▸')+'</button>'):'<span class="ftoggle-ph"></span>')
    +   '<span class="ficon" style="color:'+cmeta.hex+'">'+(folder.icon||'📁')+'</span>'
    +   '<span class="fname">'+esc(folder.name)+'</span>'
    +   '<span class="fcount">'+(counts[folder.id]||0)+'</span>'
    +   '<span class="fops">'

function renderTagFilterList(){
  var all=allTagsWithCount();
  var q=(S.tagFilterQuery||'').trim().toLowerCase();
  var list=q?all.filter(function(t){ return t.name.toLowerCase().indexOf(q)>=0; }):all;
  var showAll=S.showAllTags||!!q;
  var shown=showAll?list:list.slice(0,10);
  var html='';
  if(all.length>5) html+='<input type="text" class="tagfilter" id="tagFilterInput" placeholder="過濾標籤名稱..." value="'+esc(S.tagFilterQuery||'')+'">';
  html+='<div class="tagwrap">';
  if(!shown.length) html+='<span class="hint" style="padding:4px 6px">'+(q?'找不到相符的標籤':'尚無任何標籤')+'</span>';
  shown.forEach(function(t){
    var active=S.selectedTags.indexOf(t.name)>=0;
    var st=tagStyle(t.name);
    html+='<span class="pill" style="'+(active?activeStyle(st.hex):pillStyle(st.hex))+'" data-act="tag-toggle" data-tag="'+esc(t.name)+'">'
        + '<span class="dot" style="background:'+(active?'#fff':st.hex)+'"></span>'+esc(t.name)+' <span class="n">'+t.count+'</span></span>';
  });
  html+='</div>';
  if(!q&&all.length>10) html+='<button type="button" class="more-tag-btn" data-act="tags-more">'+(S.showAllTags?'收合部分標籤':'顯示全部 '+all.length+' 個標籤')+'</button>';
  return html;
}

    + '<div class="ddopt" data-act="undo-last" style="'+(S.historyStack.length?'':'opacity:.4')+'">↩️ 還原上一步'+(S.historyStack.length?('<span class="dsc">'+S.historyStack[S.historyStack.length-1].label+'</span>'):'<span class="dsc">沒有可還原</span>')+'</div>'

function renderSearchDrop(){
  var root=$('searchDropRoot'); root.innerHTML='';

    });
    h2+='</div>'; root.innerHTML=h2;
  }
}

function renderContent(){
  var list=filteredItems();

  var html='<div class="hd-row"><span class="hd-title">'+esc(title)+'</span><span class="hd-cnt">共 '+list.length+' 項</span></div>';

  if(S.selectedTags.length||S.searchQuery.trim()){
    html+='<div class="filterbar"><span class="lbl">目前篩選：</span>';
    if(S.searchQuery.trim()) html+='<span class="fchip">'+esc(SEARCH_MODES.filter(function(m){return m.id===S.searchMode;})[0].label)+'：「'+esc(S.searchQuery)+'」<button type="button" data-act="search-clear">✕</button></span>';
    S.selectedTags.forEach(function(t){ html+='<span class="fchip">#'+esc(t)+'<button type="button" data-act="tag-toggle" data-tag="'+esc(t)+'">✕</button></span>'; });
    html+='<button type="button" class="clearall" data-act="filter-clear-all">全部清除</button></div>';
  }

  if(!list.length){
    html+='<div class="empty"><div class="ic">🗂️</div><h3>'+(S.items.length?'找不到符合條件的收藏':'還沒有任何收藏')+'</h3>'
      + '<p>'+(S.items.length?'可以試著切換搜尋關鍵字或清除篩選條件。':'點下面的按鈕，開始收集網頁、圖片或靈感筆記吧！')+'</p>'
      + (S.items.length?'<button type="button" class="btn" data-act="filter-clear-all" style="margin-right:8px">重設篩選</button>':'')
      + '<button type="button" class="btn pri" data-act="add-item">＋ 新增第一筆收藏</button></div>';
  }else if(S.settings.viewMode==='grid'){
    html+='<div class="grid">'+list.map(cardHtml).join('')+'</div>';
  }else{
    html+='<div class="listwrap">'+list.map(listRowHtml).join('')+'</div>';
  }
  $('content').innerHTML=html;
}

function render(){
  renderSidebar();
  renderTopbar();
  renderContent();
}

// =====================================================================
// 事件：委派綁定（只綁一次，用 data-act 判斷動作，避免重繪後重複綁定）
// =====================================================================
var dragState=null;

function act(el){ return el.getAttribute('data-act'); }

function onBodyClick(e){
  var t=e.target;
  var el;

  // 注意：資料夾列（data-act=nav）底下包了 ftoggle／folder-edit／folder-del／folder-move／folder-add-sub 這幾個按鈕，
  // 所以這幾個「比較具體」的判斷一定要排在 nav 前面，不然 t.closest('[data-act=nav]') 會先抓到外層的列，按鈕就永遠點不到。
  if((el=t.closest('[data-act=ftoggle]'))){ e.stopPropagation(); var fid=el.getAttribute('data-id'); S.expandedFolders[fid]=!S.expandedFolders[fid]; renderSidebar(); return; }
  if((el=t.closest('[data-act=folder-add-sub]'))){ e.stopPropagation(); openFolderModal('create',el.getAttribute('data-id'),null); return; }
  if((el=t.closest('[data-act=folder-edit]'))){ e.stopPropagation(); var f1=folderById(el.getAttribute('data-id')); if(f1) openFolderModal('edit',f1.parentId,f1); return; }
  if((el=t.closest('[data-act=folder-del]'))){ e.stopPropagation(); var f2=folderById(el.getAttribute('data-id')); if(f2) deleteFolder(f2); return; }
  if((el=t.closest('[data-act=folder-move]'))){ e.stopPropagation(); openMoveMenu('folder',el.getAttribute('data-id')); return; }
  if((el=t.closest('[data-act=nav]'))){ S.selectedNav=el.getAttribute('data-id'); S.sidebarOpen=false; applySidebarOpen(); render(); return; }
  if((el=t.closest('[data-act=folders-toggle]'))){ S.foldersExpanded = S.foldersExpanded===false?true:false; renderSidebar(); return; }
  if((el=t.closest('[data-act=folder-add-root]'))){ e.stopPropagation(); openFolderModal('create',null,null); return; }
  if((el=t.closest('[data-act=tags-clear]'))){ e.stopPropagation(); S.selectedTags=[]; render(); return; }
  if((el=t.closest('[data-act=tag-toggle]'))){ var tag=el.getAttribute('data-tag'); var i=S.selectedTags.indexOf(tag); if(i>=0) S.selectedTags.splice(i,1); else S.selectedTags.push(tag); render(); return; }
  if((el=t.closest('[data-act=card-tag]'))){ e.stopPropagation(); var tag2=el.getAttribute('data-tag'); if(S.selectedTags.indexOf(tag2)<0) S.selectedTags.push(tag2); render(); return; }
  if((el=t.closest('[data-act=tags-more]'))){ S.showAllTags=!S.showAllTags; renderSidebar(); return; }

  if((el=t.closest('#hamb'))){ S.sidebarOpen=true; applySidebarOpen(); return; }
  if(t.id==='sideClose'||t.id==='sidebarMask'){ S.sidebarOpen=false; applySidebarOpen(); return; }

  if((el=t.closest('[data-act=plat-pick]'))){ S.selectedPlatform=el.getAttribute('data-id'); render(); return; }
  if((el=t.closest('[data-act=view-set]'))){ S.settings.viewMode=el.getAttribute('data-v'); saveSettings(); render(); return; }
  if(t.id==='undoBtn'){ e.stopPropagation(); S.undoOpen=!S.undoOpen; renderUndoDrop(); return; }
  if((el=t.closest('[data-act=undo-last]'))){ S.undoOpen=false; undoLast(); return; }
  if((el=t.closest('[data-act=undo-all]'))){ S.undoOpen=false; restoreAllConfirm(); return; }

  if(t.id==='searchModeBtn'){ e.stopPropagation(); S.modeOpen=!S.modeOpen; S.searchOpen=false; renderSearchDrop(); return; }
  if((el=t.closest('[data-act=mode-pick]'))){ S.searchMode=el.getAttribute('data-id'); S.modeOpen=false; renderTopbar(); $('searchInput').focus(); return; }
  if(t.id==='searchClear'){ S.searchQuery=''; renderTopbar(); render(); return; }
  if((el=t.closest('[data-act=sug-pick]'))){ var sug=searchSuggestions()[parseInt(el.getAttribute('data-idx'),10)]; applySuggestion(sug); return; }
  if((el=t.closest('[data-act=search-clear]'))){ S.searchQuery=''; render(); return; }
  if((el=t.closest('[data-act=filter-clear-all]'))){ S.selectedTags=[]; S.searchQuery=''; render(); return; }

  if((el=t.closest('[data-act=add-item]'))||t.id==='btnAddItem'){ openItemModal(null); return; }
  if(t.id==='btnSettings'){ S.modal={type:'settings'}; renderModal(); return; }
  // 注意：卡片／清單列（data-act=open-detail）底下包了 item-edit／item-del／quick-move 這幾個快速按鈕，
  // 一樣要排在 open-detail 前面，不然點按鈕只會打開詳細頁，按鈕本身的動作永遠執行不到。
  if((el=t.closest('[data-act=item-edit]'))){ e.stopPropagation(); var it2=S.items.filter(function(x){return x.id===el.getAttribute('data-id');})[0]; if(it2) openItemModal(it2); return; }
  if((el=t.closest('[data-act=item-del]'))){ e.stopPropagation(); var it3=S.items.filter(function(x){return x.id===el.getAttribute('data-id');})[0]; if(it3) deleteItem(it3); return; }
  if((el=t.closest('[data-act=quick-move]'))){ e.stopPropagation(); openMoveMenu('item',el.getAttribute('data-id')); return; }
  if((el=t.closest('[data-act=open-detail]'))){ var it1=S.items.filter(function(x){return x.id===el.getAttribute('data-id');})[0]; if(it1){ S.modal={type:'detail',item:it1}; renderModal(); } return; }
  if((el=t.closest('[data-act=detail-edit]'))){ var it4=S.items.filter(function(x){return x.id===el.getAttribute('data-id');})[0]; closeModal(); if(it4) openItemModal(it4); return; }
  if((el=t.closest('[data-act=detail-del]'))){ var it5=S.items.filter(function(x){return x.id===el.getAttribute('data-id');})[0]; if(it5) deleteItem(it5); return; }
  if((el=t.closest('[data-act=detail-move]'))){ openMoveMenu('item',el.getAttribute('data-id')); return; }
  if((el=t.closest('[data-act=detail-tag]'))){ var tag3=el.getAttribute('data-tag'); if(S.selectedTags.indexOf(tag3)<0) S.selectedTags.push(tag3); closeModal(); render(); return; }

  if((el=t.closest('[data-act=modal-close]'))){ closeModal(); return; }
  if((el=t.closest('[data-act=ov-close]')) && t===el){ closeModal(); return; }
  if((el=t.closest('[data-act=confirm-bg]')) && t===el){ closeConfirm(); return; }
  if((el=t.closest('[data-act=confirm-cancel]'))){ closeConfirm(); return; }
  if((el=t.closest('[data-act=confirm-ok]'))){ if(S.confirm&&S.confirm.onConfirm) S.confirm.onConfirm(); return; }

  if((el=t.closest('[data-act=pick-color]'))){ S.modal.color=el.getAttribute('data-id'); renderModal(); return; }
  if((el=t.closest('[data-act=pick-icon]'))){ S.modal.icon=el.getAttribute('data-ic'); renderModal(); return; }
  if((el=t.closest('[data-act=ct-switch]'))){ S.modal.contentType=el.getAttribute('data-v'); renderModal(); return; }
  if((el=t.closest('[data-act=pick-plat]'))){ S.modal.platform=el.getAttribute('data-id'); renderModal(); return; }
  if((el=t.closest('[data-act=add-plat-toggle]'))){ S.modal.addingPlatform=!S.modal.addingPlatform; renderModal(); return; }
  if((el=t.closest('[data-act=add-plat-go]'))){ var pv=$('if-newplat').value; var npid=addCustomPlatform(pv,'🔗'); if(npid){ S.modal.platform=npid; S.modal.addingPlatform=false; S.modal.newPlatName=''; } renderModal(); return; }
  if((el=t.closest('[data-act=quick-folder-toggle]'))){ S.modal.quickFolder=!S.modal.quickFolder; renderModal(); return; }
  if((el=t.closest('[data-act=quick-folder-go]'))){
    var fname=$('if-newfolder').value.trim();
    if(fname){ snapshot('建立主目錄「'+fname+'」'); var nf2={id:uid('col'),name:fname,parentId:null,color:'amber',icon:'📁'}; S.folders.push(nf2); saveFolders(); S.modal.folderId=nf2.id; S.modal.newFolderName=''; }
    S.modal.quickFolder=false; renderModal(); return;
  }
  if((el=t.closest('[data-act=tag-add]'))){ addTagFromInput(); return; }
  if((el=t.closest('[data-act=tag-del]'))){ e.stopPropagation(); var td=el.getAttribute('data-tag'); S.modal.tags=S.modal.tags.filter(function(x){return x!==td;}); renderTagEditBox(); return; }
  if((el=t.closest('[data-act=tag-cycle]'))){ var tc=el.getAttribute('data-tag'); var cur=tagStyle(tc); var idx=COLORS.map(function(c){return c.id;}).indexOf(cur.id); var next=COLORS[(idx+1)%COLORS.length]; S.tagColors[tc]=next.id; saveTagColors(); renderTagEditBox(); return; }

  if((el=t.closest('[data-act=move-pick]'))){
    var mk=el.getAttribute('data-kind'), mt=el.getAttribute('data-target')||'';
    if(mk==='item') moveItemTo(S.modal.id,mt); else moveFolderTo(S.modal.id,mt);
    closeModal(); return;
  }

  if((el=t.closest('[data-act=export-go]'))){ exportData(); return; }
  if((el=t.closest('[data-act=import-trigger]'))){ $('importFileInput').click(); return; }
  if((el=t.closest('[data-act=import-go]'))){ confirmImport(el.getAttribute('data-mode')); return; }
  if((el=t.closest('[data-act=del-plat]'))){ deleteCustomPlatform(el.getAttribute('data-id')); return; }
  if((el=t.closest('[data-act=reset-all]'))){ restoreAllConfirm(); return; }

  // 點擊外部關閉搜尋/模式/還原下拉
  if(!t.closest('#searchBox')){ if(S.searchOpen||S.modeOpen){ S.searchOpen=false; S.modeOpen=false; renderSearchDrop(); } }
  if(!t.closest('#platRow')){ if(S.undoOpen){ S.undoOpen=false; renderUndoDrop(); } }
}

function addTagFromInput(){
  var input=$('if-tagin'); if(!input) return;
  var v=input.value.trim().replace(/^#/,''); if(!v) return;
  if(S.modal.tags.indexOf(v)<0) S.modal.tags.push(v);
  if(!S.tagColors[v]) S.tagColors[v]=S.modal.tagColorId||COLORS[9].id;
  input.value='';
  S.modal.tagInput='';
  renderTagEditBox();
}
function renderTagEditBox(){ var box=$('if-tagedit'); if(box) box.innerHTML=renderTagEdit(S.modal.tags); }

function applySuggestion(sug){
  if(!sug) return;
  if(sug.type==='item'){
    var it=S.items.filter(function(x){return x.id===sug.itemId;})[0];
    S.searchOpen=false; if(it){ S.modal={type:'detail',item:it}; renderModal(); }
    renderTopbar();
  }else if(sug.type==='tag'){
    if(S.selectedTags.indexOf(sug.value)<0) S.selectedTags.push(sug.value);
    S.searchQuery=''; S.searchOpen=false; render();
  }else{
    S.searchQuery=sug.value; recordSearch(sug.value); S.searchOpen=false; render();
  }
}

function applySidebarOpen(){
  $('sidebar').classList.toggle('open',S.sidebarOpen);
  $('sidebarMask').classList.toggle('show',S.sidebarOpen);
}

function onBodyInput(e){
  var t=e.target;
  if(t.id==='searchInput'){ S.searchQuery=t.value; S.activeSug=-1; S.searchOpen=true; S.modeOpen=false; $('searchClear').hidden=!t.value; renderSearchDrop(); return; }
  if(t.id==='tagFilterInput'){ S.tagFilterQuery=t.value; var pos=t.selectionStart; var wrap=t.parentElement; renderSidebarTagsOnly(); var again=$('tagFilterInput'); if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(_){} } return; }
  if(t.id==='ff-name'){ S.modal.name=t.value; var pv=$('ff-prevname'); if(pv) pv.textContent=t.value||'資料夾預覽名稱'; return; }
  if(t.id==='if-title'){ S.modal.title=t.value; return; }
  if(t.id==='if-url'){ S.modal.url=t.value; var dp=detectPlatform(t.value); if(dp) S.modal.platform=dp; return; }
  if(t.id==='if-notes'){ S.modal.notes=t.value; return; }
  if(t.id==='if-tagin'){ S.modal.tagInput=t.value; return; }
  if(t.id==='if-newplat'){ S.modal.newPlatName=t.value; return; }
  if(t.id==='if-newfolder'){ S.modal.newFolderName=t.value; return; }
  if(t.id==='if-file'){
    var file=t.files&&t.files[0]; if(!file) return;
    if(file.size>4*1024*1024){ toast('檔案請勿超過 4MB','bad'); t.value=''; return; }
    var isPdf=file.type==='application/pdf'||/\.pdf$/i.test(file.name);
    S.modal.platform=isPdf?'pdf':'image';
    S.modal.fileName=file.name;
    var reader=new FileReader();
    reader.onload=function(ev){ S.modal.fileData=ev.target.result; renderModal(); };
    reader.readAsDataURL(file);
    return;
  }
  if(t.id==='importFileInput'){ handleImportFile(e); return; }
}
function renderSidebarTagsOnly(){
  // 只重繪標籤區塊，避免輸入時整個側邊欄重繪導致輸入框失焦
  var secs=document.querySelectorAll('#sideBody .side-sec');
  if(secs.length>=3){
    var tagSec=secs[secs.length-1];
    var hd=tagSec.querySelector('.sec-hd').outerHTML;
    tagSec.innerHTML=hd+renderTagFilterList();
  }
}
function onBodyChange(e){
  var t=e.target;
  if(t.id==='sortSel'){ S.settings.sortBy=t.value; saveSettings(); render(); return; }
  if(t.id==='if-folder'){ S.modal.folderId=t.value; return; }
}
function onBodyKeydown(e){
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!e.shiftKey){
    var tag=(document.activeElement&&document.activeElement.tagName||'').toLowerCase();
    if(tag!=='input'&&tag!=='textarea'&&tag!=='select'){ e.preventDefault(); if(S.historyStack.length) undoLast(); return; }
  }
  if(e.target&&e.target.id==='searchInput'){
    var sug=searchSuggestions();
    if(e.key==='Escape'){ S.searchOpen=false; S.activeSug=-1; renderSearchDrop(); return; }
    if(!sug.length) return;
    if(e.key==='ArrowDown'){ e.preventDefault(); S.activeSug=(S.activeSug+1)%sug.length; renderSearchDrop(); return; }
    if(e.key==='ArrowUp'){ e.preventDefault(); S.activeSug=S.activeSug<=0?sug.length-1:S.activeSug-1; renderSearchDrop(); return; }
    if(e.key==='Enter'){
      e.preventDefault();
      if(S.activeSug>=0&&sug[S.activeSug]) applySuggestion(sug[S.activeSug]);
      else { recordSearch(S.searchQuery); S.searchOpen=false; render(); }
      return;
    }
  }
  if(e.target&&e.target.id==='if-tagin'&&(e.key==='Enter'||e.key===',')){ e.preventDefault(); addTagFromInput(); }
  if(e.target&&e.target.id==='if-newplat'&&e.key==='Enter'){ e.preventDefault(); var pv=$('if-newplat').value; var npid=addCustomPlatform(pv,'🔗'); if(npid){ S.modal.platform=npid; S.modal.addingPlatform=false; } renderModal(); }
  if(e.target&&e.target.id==='if-newfolder'&&e.key==='Enter'){ e.preventDefault(); $('[data-act=quick-folder-go]')&&0; var btn=document.querySelector('[data-act=quick-folder-go]'); if(btn) btn.click(); }
}
function onBodySubmit(e){
  if(e.target&&e.target.id==='folderForm'){ submitFolderModal(e); return; }
  if(e.target&&e.target.id==='itemForm'){ submitItemModal(e); return; }
}

function wireModalEvents(){
  // 目前 modal 內的表單提交／輸入已透過 document 層級委派處理，這裡保留擴充點。
}

// ===== 拖放（桌面滑鼠的加分體驗；手機請使用各處的「📤移動」按鈕）=====
function onDragStart(e){
  var el=e.target.closest('[data-drag]'); if(!el) return;
  dragState={kind:el.getAttribute('data-drag'),id:el.getAttribute('data-drag')==='item'?el.getAttribute('data-iid'):el.getAttribute('data-fid')};
  try{ e.dataTransfer.setData('text/plain',dragState.id); e.dataTransfer.effectAllowed='move'; }catch(_){}
}
function onDragOver(e){
  var el=e.target.closest('[data-drop]'); if(!el||!dragState) return;
  e.preventDefault();
  el.classList.add('dragover');
}
function onDragLeave(e){
  var el=e.target.closest('[data-drop]'); if(el) el.classList.remove('dragover');
}
function onDrop(e){
  var el=e.target.closest('[data-drop]'); if(!el||!dragState) return;
  e.preventDefault();
  el.classList.remove('dragover');
  var targetFid=el.getAttribute('data-dropfid');
  if(dragState.kind==='item') moveItemTo(dragState.id,targetFid);
  else if(dragState.kind==='folder'&&targetFid!==dragState.id) moveFolderTo(dragState.id,targetFid||null);
  dragState=null;
}

// =====================================================================
// 外部分享接收：手機「捷徑」App 把分享清單的內容轉送過來時使用。
// 網址後面帶 ?url=網址&title=標題（title可省略），或帶 ?text=一段文字（裡面只要含一個網址就會自動抓出來，
// 其餘文字會放進備註），開啟頁面時就會自動新增一筆收藏，不用手動點＋新增。
// =====================================================================
function extractUrlFromText(text){
  var m=String(text||'').match(/https?:\/\/[^\s]+/i);
  return m?m[0]:'';
}
function handleIncomingShare(){
  var qs;
  try{ qs=new URLSearchParams(location.search); }catch(e){ return; }
  if(!qs.has('url')&&!qs.has('text')) return; // 沒帶分享參數，正常開啟頁面即可
  var rawUrl=(qs.get('url')||'').trim();
  var rawText=(qs.get('text')||'').trim();
  var rawTitle=(qs.get('title')||'').trim();
  var rawNote=(qs.get('note')||qs.get('notes')||'').trim();
  var url=rawUrl||extractUrlFromText(rawText);
  if(!url){ history.replaceState(null,'',location.pathname+location.hash); return; } // 抓不到網址就不留空白收藏
  var notes=rawNote;
  if(!notes&&rawText){ var leftover=rawText.split(url).join('').trim(); if(leftover) notes=leftover; }
  var platform=detectPlatform(url);
  var data={title:rawTitle,url:url,platform:platform,folderId:'',tags:[],notes:notes,coverUrl:'',fileData:null,fileName:''};
  data.title=fallbackTitle(Object.assign({},data,{_fileName:''}));
  var now=new Date().toISOString();
  snapshot('從分享新增「'+data.title+'」');
  S.items.unshift(Object.assign({id:uid('item')},data,{createdAt:now,updatedAt:now}));
  saveItems();
  toast('📥 已從分享新增收藏：'+data.title);
  history.replaceState(null,'',location.pathname+location.hash);
}

// =====================================================================
// 啟動
// =====================================================================
function init(){
  loadAll();
  handleIncomingShare();
  document.addEventListener('click',onBodyClick);
  document.addEventListener('input',onBodyInput);
  document.addEventListener('change',onBodyChange);
  document.addEventListener('keydown',onBodyKeydown);
  document.addEventListener('submit',onBodySubmit);
  document.addEventListener('dragstart',onDragStart);
  document.addEventListener('dragover',onDragOver);
  document.addEventListener('dragleave',onDragLeave);
  document.addEventListener('drop',onDrop);
  render();
}

// 給測試或除錯用（不影響正常使用）
window.SDA_COLLECT = { S:S, LS:LS, COLORS:COLORS, PLATFORMS:PLATFORMS, detectPlatform:detectPlatform, render:render, handleIncomingShare:handleIncomingShare };

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
else init();
})();
</script>
